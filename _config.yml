title: immich-family-library
description: A shared family photo library for self-hosted Immich. Members keep their own accounts and choose what to contribute.
theme: jekyll-theme-cayman

# Jekyll publishes every file not named here, so a new top-level file that is
# not part of the site needs an entry.
exclude:
  - AGENTS.md
  - Dockerfile
  - LICENSE
  - bin
  - compose.yml
  - config.example.toml
  - pyproject.toml
  - src
  - tests
  - uv.lock
