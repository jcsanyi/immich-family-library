# immich-family-library configuration.
# Copy to config.toml, fill in keys, keep it out of the repo (it's gitignored).

[immich]
# Where the service reaches Immich. Running in the same docker network as the
# Immich stack, the server's container name works: "http://immich_server:2283".
url = "https://photos.example.com"
# Optional. Any admin user's API key (the family account or a member, if
# they're an admin) with `queue.read`, plus `user.read` for the startup
# check. Before moving anything, the service checks that the sidecar and
# metadata queues have no backlog; without this key it skips that.
admin_api_key = ""

[service]
# The run lock: a file that stops two commands from writing to Immich at once.
# It only works between commands that see the same file. This value is for the
# container, where the data volume is the one place a second container
# (`docker compose run`) shares with the daemon. Outside a container, delete
# the line to get the default, "run.lock" beside this file. Relative paths
# are resolved against this file's directory.
lock_path = "/data/run.lock"
# Where a move keeps a photo's file between the download and the upload. One
# file at a time, deleted when the move ends, so it needs room for the largest
# photo or video a member has. Relative paths are resolved against this file's
# directory. Point it at a mounted volume if the container's own /tmp is too
# small.
temp_dir = "/tmp/immich-family-library"
# While true, every command that would write to Immich refuses to run; only
# `observe` and `show-config` work. Defaults to true when absent. Flip it once
# `observe` reports what you expect.
readonly = true
# A photo changed more recently than this isn't moved yet; its jobs may still
# be running. Seconds.
settle_seconds = 60
# The daemon's pause between passes. Seconds. Re-uploads don't wait for this
# when the webhook is set up; everything else does.
interval_seconds = 600

# Caps on how much one pass does, so a big backlog is worked through at a pace
# you choose rather than all at once. 0 means no limit. Commands given a
# specific id ignore them.
[limits]
albums_per_pass = 5
assets_per_pass = 20

# Tags are private to each account. The member's original gets `moved` before
# it's trashed (their own record of what they handed over; adding it is also
# what makes Immich write the sidecar the move carries). The family copy gets
# "<from_prefix>/<member>", visible when browsing as the family account.
[tags]
moved = "family"
from_prefix = "from"

# A phone that hasn't synced a deletion re-uploads moved photos once the trash
# purges. They're trashed again automatically. Once a day, at this local time,
# the daemon names each member whose re-uploads it trashed since the last report.
# The compose file gives the container the host's timezone.
[warnings]
report_at = "22:00"

# The daemon's webhook receiver. With this section present, `reconcile-albums`
# also gives every member an Immich workflow that posts each new upload here,
# so a re-upload is trashed within seconds instead of on the next pass. `url`
# is what Immich calls (the container name on the shared docker network);
# `token` is a secret you make up, sent in the X-IFL-Token header and checked
# by the receiver. The receiver serves the path of `url`, and binds `listen`
# ("host:port"). Leave the section out to run without a webhook.
# [webhook]
# url = "http://ifl:8080/webhook/asset-created"
# token = ""
# listen = "0.0.0.0:8080"

# The family account owns everything that's been shared. The email is checked
# against the account the key belongs to, so a config pointed at the wrong
# server fails at startup instead of moving photos between the wrong accounts.
[family]
email = "family@example.com"
api_key = ""
# Name of a family-owned album. Photos added here are moved but the family
# copy isn't re-added to it. This is the default.
dropbox_album = "Family Dropbox"

# One section per participating member. The section name is a label for logs
# and config; Immich identity comes from the key, checked against the email.
# Members without a section can still share albums with the family user; those
# albums are reported, not converted.
[members.alice]
email = "alice@example.com"
api_key = ""

[members.bob]
email = "bob@example.com"
api_key = ""

[members.carol]
email = "carol@example.com"
api_key = ""
