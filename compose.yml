# Runs the service next to an Immich compose stack: `docker compose up -d` in
# this checkout, with config.toml in ./config and the run lock in a named
# volume. Nothing in that volume needs a backup; see docs/deployment.md.
#
# The service joins the Immich stack's network so it can reach the server by
# container name, and so Immich's webhook can reach the service the same way:
# with the container named "ifl", the webhook url is
# http://ifl:8080/webhook/asset-created. No published port is needed.
# The network is named after the Immich compose project: for the stock
# docker-compose.yml that's "immich_default". Override with IMMICH_NETWORK if
# your project is named differently (`docker network ls` shows it).

name: immich-family-library

services:
  ifl:
    build: .
    container_name: ifl
    restart: unless-stopped
    # Rootful docker: uncomment and match the owner of ./config.
    # user: "1000:1000"
    volumes:
      - ./config:/config:ro
      - ifl-data:/data
      # The host's timezone, so that [warnings] report_at is the host's local time.
      - /etc/localtime:/etc/localtime:ro
    networks:
      - immich

volumes:
  ifl-data:

networks:
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}
