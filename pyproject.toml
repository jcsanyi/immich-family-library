[project]
name = "immich-family-library"
dynamic = ["version"]
description = "Moves shared photos from family members' Immich accounts into one family account"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    # Pinned together with the Immich version on the dev and prod instances.
    # See COMPATIBILITY.csv in the immichpy repo before bumping either.
    "immichpy==9.0.1",
    "tomli-w>=1.0",
]

[project.scripts]
ifl = "ifl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]
# Only for bin/dev/seed_dev.py
seed = [
    "pillow>=10",
    "piexif>=1.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# No --dirty: the image's build stage holds only some of the tracked files, so
# git would call every image build dirty, a release included.
raw-options = { scm = { git = { describe_command = "git describe --tags --long --match *[0-9]*" } } }

[tool.hatch.build.targets.wheel]
packages = ["src/ifl"]

[tool.uv]
# The version comes from git, so a new commit or tag must rebuild the project.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures hold XML and long call lines

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov"  # every run reports coverage; --no-cov for a quick single test

[tool.coverage.run]
source = ["ifl"]

[tool.coverage.report]
show_missing = true
skip_covered = true
