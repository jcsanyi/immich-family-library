name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs these same tests before it publishes anything.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installs uv and, through uv sync, the Python version in .python-version.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: bin/lint

      # The image's build stage lacks whatever .dockerignore lists. A tracked
      # file missing there leaves git's tree dirty, and every image then gets
      # a development version, a release included.
      - name: Check that .dockerignore lists no tracked file
        run: |
          files="$(git ls-files -ci --exclude-from=.dockerignore)"
          if [[ -n "$files" ]]; then
            echo "::error::.dockerignore lists tracked files, so every image gets a development version:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: bin/tests --cov-report=term --cov-report=html

      - name: Post coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
