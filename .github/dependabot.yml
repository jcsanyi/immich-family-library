version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The base image and uv, pinned by digest in the Dockerfile. A new Python
  # minor or major is a deliberate change with .python-version and
  # requires-python, so only patch updates arrive here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Updates pyproject.toml and uv.lock together, transitive dependencies
  # included, so the lockfile does not go stale below the declared packages.
  # Minor and patch updates arrive as one weekly pull request. A major release
  # gets its own. immichpy is not excluded on purpose: a major bump means a
  # new Immich version, and the failing pull request is the prompt to do the
  # upgrade. docs/development.md has the steps.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
